# 麒麟安全智能运维 Agent —— 后端工程配置
#
# 把「代码质量」的既有良好实践固化成「文档化、可执行、可进 CI」的强制标准
# （见 docs/code-comment-style.md）。覆盖两类：
#   1) docstring 规范（pydocstyle D）——注释质量直接计入文档评分；
#   2) 正确性/整洁度（pyflakes F、isort I、bugbear B、pyupgrade UP）——
#      捕获死代码/未定义名/未链异常/过时写法等真实工程缺陷。
# 刻意不启用 pycodestyle 的 E/W（尤其 E501 行宽）：本库注释为中文长句，
# 行宽规则只会逼着切断中文散文，噪声远大于价值（理由同 D415，见 code-comment-style.md）。
#
# 用法：
#   cd backend && source .venv/bin/activate
#   ruff check app            # 生产代码：必须 All checks passed
#   ruff check app tests      # 含测试（测试函数豁免，详见 per-file-ignores）

[tool.ruff]
target-version = "py311"
# 强制对象是生产代码 app/；测试与脚本按 per-file-ignores 放宽。
src = ["app"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
# D=docstring 规范；F=pyflakes（死代码/未定义名）；I=导入排序；
# B=bugbear（易错模式，如未链异常）；UP=pyupgrade（py311 现代化写法）。
select = ["D", "F", "I", "B", "UP"]
ignore = [
    "D105", # 魔术方法（__repr__/__enter__/__aexit__…）不强制 docstring：签名与协议即语义
    "D107", # __init__ 不单独要求 docstring：类级 docstring 已说明职责，避免重复样板
    # —— 以下为「英文正字法」规则，对本库的中文 docstring 不成立，刻意禁用 ——
    "D415", # 首行须以 .?! 结尾：中文用 。！？，强加 ASCII 句号反而破坏文本
    "D403", # 首词须首字母大写：中文无大小写，规则无意义
    "D413", # 末段后须空行：英文段落习惯，对中文非必要（google 约定亦忽略）
    # —— 以下为「行为有别于纯整洁」的规则，刻意禁用以免引入语义变化 ——
    "UP042", # (str, Enum) → StrEnum：StrEnum 改变 str() 语义（影响序列化/比较），属行为变更非整洁化
]

[tool.ruff.lint.pydocstyle]
# 统一 Google 风格（Args:/Returns:/Raises:）——与代码库现有 100% docstring 一致。
convention = "google"

[tool.ruff.lint.per-file-ignores]
# 测试 / 脚本不是对外 API 面：强制「有模块/包 docstring」（D100/D104）以交代用途，
# 但其 docstring 是自由式说明，不强制 Google 段落格式（D205/D209）与函数级 docstring。
# 严格的 Google 风格只压在生产代码 app/ 上。
"tests/**" = ["D101", "D102", "D103", "D106", "D205", "D209", "D301"]
"scripts/**" = ["D101", "D102", "D103", "D205", "D209", "D301"]
