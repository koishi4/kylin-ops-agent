    <!-- 首屏前置换肤：在样式渲染前读取已存偏好并落到 <html data-theme>，避免暗↔亮切换闪烁。
         无偏好时不设属性 = 默认石墨暗色（本作品品牌基调）。 -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('kylin-theme')
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
        } catch (e) {}
      })()
    </script>
